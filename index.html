<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- ============================================================
         ENCODING & VIEWPORT
         ============================================================ -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />

    <!-- ============================================================
         TITLE
         ============================================================ -->
    <title>Dan Kamau Mwaura — Full Stack Developer & AI Engineer</title>

    <!-- ============================================================
         PRIMARY META
         ============================================================ -->
    <meta
      name="description"
      content="Full Stack Developer and AI Engineer building scalable SaaS systems, RAG pipelines, and modern web applications. Based in Nairobi, Kenya."
    />
    <meta name="author" content="Dan Kamau Mwaura" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0B0F19" />

    <!-- ============================================================
         CANONICAL
         ⚠️ Replace with your production domain before deploy.
         ============================================================ -->
    <link rel="canonical" href="https://dan-kamau-mwaura.dev/" />

    <!-- ============================================================
         OPEN GRAPH (LinkedIn, Facebook, WhatsApp, Slack, Discord)
         ⚠️ og:image must be an ABSOLUTE https:// URL.
         ============================================================ -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dan Kamau Mwaura" />
    <meta property="og:title" content="Dan Kamau Mwaura — Full Stack Developer & AI Engineer" />
    <meta
      property="og:description"
      content="Building scalable SaaS systems, AI-powered applications, and modern business platforms."
    />
    <meta property="og:url" content="https://dan-kamau-mwaura.dev/" />
    <meta property="og:image" content="https://dan-kamau-mwaura.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Dan Kamau Mwaura — Full Stack Developer & AI Engineer"
    />
    <meta property="og:locale" content="en_US" />

    <!-- ============================================================
         TWITTER / X CARD
         ⚠️ Replace @your-handle with your actual X handle (or remove
         twitter:creator if you don't use X).
         ============================================================ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dan Kamau Mwaura   — Full Stack Developer & AI Engineer" />
    <meta
      name="twitter:description"
      content="Building scalable SaaS systems, AI-powered applications, and modern business platforms."
    />
    <meta name="twitter:image" content="https://dan-kamau-mwaura.dev/og-image.png" />
    <meta name="twitter:creator" content="@your-handle" />

    <!-- ============================================================
         ICONS
         ⚠️ Add these files to `public/`:
           - favicon.ico       (browser tab, 32x32 or multi-res)
           - apple-touch-icon.png  (iOS home screen, 180x180)
           - og-image.png      (social preview, 1200x630)
         ============================================================ -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- ============================================================
         FONTS — Inter
         preconnect: opens the connection early (~100–300ms faster).
         display=swap: renders fallback text immediately, swaps to
         Inter when loaded (prevents invisible text flash).
         ============================================================ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
